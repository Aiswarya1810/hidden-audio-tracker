{% extends 'tracker/base.html' %}

{% block content %}
<section class="form-page">
    <div class="form-card">
        <h1>Send Secure Audio</h1>
        <p class="subtitle">Hide audio inside an image and send it to another user.</p>

        <form method="POST" enctype="multipart/form-data" class="modern-form">
            {% csrf_token %}

            <label>Receiver</label>
            <select name="receiver" required>
                <option value="">Select receiver</option>
                {% for u in users %}
                    <option value="{{ u.id }}">{{ u.username }}</option>
                {% endfor %}
            </select>

            <label>Subject</label>
            <input type="text" name="subject" required>

            <label>Note</label>
            <textarea name="note" placeholder="Optional message"></textarea>

            <label>Carrier Image</label>
            <input type="file" name="image" accept="image/*" required onchange="previewFile(event, 'imagePreview')">
            <img id="imagePreview" class="preview-img" style="display:none;">

            <label>Secret Audio</label>
            <input type="file" name="audio" accept="audio/*" required onchange="previewAudio(event)">
            <audio id="audioPreview" controls style="display:none;"></audio>

            <label>Secret Password</label>
            <input type="password" name="password" required>

            <button class="btn primary full">Send Secure Message</button>
        </form>
    </div>
</section>
{% endblock %}
